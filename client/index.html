    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Assistants Consulting",
      "alternateName": "Assistants Consultoria Atuarial",
      "url": "https://www.assistants.com.br",

      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Rio de Janeiro",
        "addressRegion": "RJ",
        "addressCountry": "BR"
      },
      "contactPoint": {
        "@type": "ContactPoint",

      },

      ],

        "Consultoria Atuarial",

    <!-- Structured Data: ProfessionalService -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Assistants Consulting",
      "url": "https://www.assistants.com.br",
      "priceRange": "$$$$",
      "serviceType": "Actuarial Consulting",
      "areaServed": {
        "@type": "Country",
        "name": "Brazil"
      },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Serviços de Consultoria Atuarial",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Consultoria em Saúde Suplementar",
              "description": "Precificação, provisões técnicas, modelagem de risco e compliance regulatório para operadoras de planos de saúde."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Consultoria em Previdência Complementar",
              "description": "Avaliação atuarial, estudos de aderência, ALM e governança para entidades fechadas e abertas de previdência."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Benefícios Pós-Emprego",
              "description": "Avaliações atuariais conforme CPC 33 / IAS 19, gestão de passivos e estratégias de funding."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Gestão de Riscos e Compliance",
              "description": "Modelagem de riscos atuariais, testes de adequação de passivos e conformidade regulatória ANS/PREVIC/SUSEP."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Tecnologia e Dados Atuariais",
              "description": "Soluções tecnológicas proprietárias, automação de cálculos e dashboards de inteligência atuarial."
            }
          }
        ]
      }
    }
    </script>
    <!-- Structured Data: WebSite (para SearchAction) -->
    <script type="application/ld+json">

      "@context": "https://schema.org",

      "url": "https://www.assistants.com.br",
      "inLanguage": ["pt-BR", "en"],

        "@type": "SearchAction",
        "target": "https://www.assistants.com.br/insights?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
